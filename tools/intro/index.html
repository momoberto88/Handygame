<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Runaway Rivals – Intro</title>
    <style>
      @font-face {
        font-family: 'Patrick Hand';
        src: url('./fonts/PatrickHand.ttf') format('truetype');
      }
      @font-face {
        font-family: 'Permanent Marker';
        src: url('./fonts/PermanentMarker.ttf') format('truetype');
      }
      html,
      body {
        margin: 0;
        background: #111;
        overflow: hidden;
      }
      /* keeps the fonts in use so the browser has them ready before Phaser draws text */
      .preload {
        position: absolute;
        left: -9999px;
      }
    </style>
  </head>
  <body>
    <span class="preload" style="font-family: 'Patrick Hand'">a</span>
    <span class="preload" style="font-family: 'Permanent Marker'">a</span>
    <div id="film"></div>
    <script type="module" src="./film.ts"></script>
  </body>
</html>
