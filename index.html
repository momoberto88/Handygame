<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Security rules: only this site's own code runs; connections only to this site and the PeerJS
         matchmaking service (localhost only for tests on this computer). Voice/data go directly between phones. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; font-src 'self' data:; connect-src 'self' data: blob: https://0.peerjs.com wss://0.peerjs.com http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1d1a2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Runaway Rivals" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>Runaway Rivals</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1d1a2f; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { position: fixed; inset: 0; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #1d1a2f; color: #ffe9a8;
        font: 700 22px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px; }
      #rotate .phone { width: 60px; height: 100px; border: 5px solid #ffe9a8; border-radius: 12px;
        animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div><div>Bitte dreh dein Handy<br />ins Querformat</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
